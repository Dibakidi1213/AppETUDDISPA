{% extends "base.html" %}
{% block content %}
<div class="row">
  <div class="col-md-8 mx-auto">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">✏️ Modifier la session</h5>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Nom de la session *</label>
            <input class="form-control" name="label" value="{{ exam['label'] }}" required placeholder="Ex: Examen Final 2024">
          </div>
          <div class="mb-3">
            <label class="form-label">Période *</label>
            <select class="form-select" name="session_type" required>
              <option value="Matin" {% if exam['session_type'] == 'Matin' %}selected{% endif %}>🌅 Matin</option>
              <option value="Après-midi" {% if exam['session_type'] == 'Après-midi' %}selected{% endif %}>☀️ Après-midi</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Promotions * (Sélection multiple)</label>
            <select class="form-select" name="promotion_ids" multiple size="5" required>
              {% for promo in promotions %}
              <option value="{{ promo.id }}" {% if promo.id in current_promo_ids %}selected{% endif %}>{{ promo.name }}</option>
              {% endfor %}
            </select>
            <small class="text-muted d-block mt-1">💡 Maintenez Ctrl (Windows) ou Cmd (Mac) pour sélectionner plusieurs promotions</small>
          </div>
          <div class="btn-group w-100">
            <button type="submit" class="btn btn-primary">✓ Enregistrer les modifications</button>
            <a href="{{ url_for('exams') }}" class="btn btn-secondary">❌ Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
