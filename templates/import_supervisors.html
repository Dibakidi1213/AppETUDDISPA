{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h5 class="card-title">📤 Importer les surveillants (Excel)</h5>
    <p class="text-muted mb-3">Colonnes attendues : <strong>username</strong> (obligatoire), <strong>password</strong> (obligatoire).</p>
    <form method="post" enctype="multipart/form-data">
      <div class="row g-3 align-items-end">
        <div class="col-md-6">
          <label for="excel" class="form-label">Fichier Excel (.xlsx, .xls)</label>
          <input class="form-control" type="file" id="excel" name="excel" accept=".xlsx,.xls" required>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">📥 Importer</button>
        </div>
      </div>
    </form>
    <hr>
    <div class="mt-3">
      <p class="mb-1"><strong>👁️ Total surveillants en base : <span class="badge bg-info">{{ total }}</span></strong></p>
    </div>
  </div>
</div>
{% endblock %}
